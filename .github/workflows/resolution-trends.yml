name: Resolution Trend & Escalation Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'
permissions:
  contents: write
jobs:
  trend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_resolution_trends.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@noreply.github.com'
          git add data/workflows/resolution-trends.json reports/workflows/resolution-trends-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh resolution trend analytics'
          git push

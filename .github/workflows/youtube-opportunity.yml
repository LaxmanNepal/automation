name: YouTube Opportunity Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # 11:00 Kuwait (UTC+3)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build topic shortlist
        run: python3 scripts/build_youtube_opportunities.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube/latest.json reports/youtube/
          if git diff --cached --quiet; then
            echo "No YouTube opportunity changes."
            exit 0
          fi
          git commit -m "chore: refresh YouTube opportunities"
          git push

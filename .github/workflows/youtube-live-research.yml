name: YouTube Live Research

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *" # 11:30 Kuwait (UTC+3)

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect live signals
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/research_youtube_live.py
      - name: Commit research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube/live_research.json reports/youtube/
          if git diff --cached --quiet; then
            echo "No research changes."
            exit 0
          fi
          git commit -m "chore: refresh YouTube live research"
          git push

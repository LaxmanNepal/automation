name: Resolution Trend & Bottleneck Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build concentration and aging signals
        run: python3 scripts/build_resolution_bottlenecks.py
      - name: Commit analytics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@noreply.github.com'
          git add data/workflows/resolution-bottlenecks.json reports/workflows/resolution-bottlenecks-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh resolution bottleneck analytics'
          git push

name: Change Verification
on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build change verification
        run: python3 scripts/build_change_verification.py
      - name: Commit verification ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workflows/change-verification.json reports/workflows/change-verification-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh change verification"
          git push

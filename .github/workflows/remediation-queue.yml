name: Remediation Queue
on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build remediation queue
        run: python3 scripts/build_remediation_queue.py
      - name: Commit queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workflows/remediation.json reports/workflows/remediation-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh remediation queue"
          git push
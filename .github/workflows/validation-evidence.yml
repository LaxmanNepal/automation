name: Validation Evidence
on:
  workflow_dispatch:
  schedule:
    - cron: "45 10 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build validation evidence
        run: python3 scripts/build_validation_evidence.py
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workflows/validation.json reports/workflows/validation-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh validation evidence"
          git push
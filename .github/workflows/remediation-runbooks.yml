name: Remediation Runbooks
on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runbooks
        run: python3 scripts/build_remediation_runbooks.py
      - name: Commit runbooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workflows/runbooks.json reports/workflows/runbooks-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh remediation runbooks"
          git push

name: Laxman OS - Action Queue

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *" # 09:30 Kuwait (UTC+3)

permissions:
  contents: write

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: python scripts/validate_config.py
      - name: Build health data
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_health.py
      - name: Build action queue
        run: python scripts/build_action_queue.py
      - name: Commit queue
        run: |
          git config user.name "laxman-os[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/actions/ data/github/health.json
          git diff --cached --quiet || git commit -m "chore: update action queue"
          git push

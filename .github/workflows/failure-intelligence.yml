name: Failure Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"
permissions:
  contents: write
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build failure intelligence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/build_failure_intelligence.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workflows/failures.json reports/workflows/failures-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh failure intelligence"
          git push

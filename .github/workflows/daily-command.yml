name: Laxman OS - Daily Command

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 09:00 Kuwait (UTC+3)

permissions:
  contents: write

jobs:
  daily-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate configuration
        run: python scripts/validate_config.py
      - name: Build GitHub health data
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_health.py
      - name: Build daily report
        run: python scripts/build_daily_report.py
      - name: Commit generated report
        run: |
          git config user.name "laxman-os[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github/health.json reports/daily/
          git diff --cached --quiet || git commit -m "chore: update daily command report"
          git push

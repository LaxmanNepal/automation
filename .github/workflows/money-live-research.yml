name: Money Live Research

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # 10:00 Kuwait (UTC+3)

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect current opportunity signals
        run: python3 scripts/research_money_live.py
      - name: Commit research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities/live_research.json reports/opportunities/
          if git diff --cached --quiet; then
            echo "No money research changes."
            exit 0
          fi
          git commit -m "chore: refresh money opportunity research"
          git push

name: Resolution SLA Analytics
on:
  workflow_dispatch:
  schedule:
    - cron: '45 11 * * *'
permissions:
  contents: write
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SLA metrics
        run: python3 scripts/build_resolution_sla.py
      - name: Commit SLA metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/workflows/resolution-sla.json reports/workflows/resolution-sla-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh resolution SLA analytics'
          git push

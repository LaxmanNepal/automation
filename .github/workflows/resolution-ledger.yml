name: Resolution Ledger
on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'
permissions:
  contents: write
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build resolution ledger
        run: python3 scripts/build_resolution_ledger.py
      - name: Commit ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/workflows/resolution.json reports/workflows/resolution-latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh resolution ledger'
          git push